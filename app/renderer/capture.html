<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'none'">
<title>Anotar</title>
<link rel="stylesheet" href="vendor/aurora-tokens.css">
<style>
  html, body { background: transparent; height: 100%; overflow: hidden; }
  body { font-family: var(--font); }
  .cap { margin: 8px; height: calc(100% - 16px); border-radius: 16px; background: var(--surface); border: 1px solid var(--stroke-2);
    box-shadow: var(--shadow-lg); display: flex; flex-direction: column; padding: 12px 14px; gap: 8px; }
  textarea { flex: 1; border: 0; outline: none; resize: none; background: none; color: var(--txt); font: 500 16px/1.4 var(--font); }
  textarea::placeholder { color: var(--faint); }
  .bar { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
  .pill { border: 1px solid var(--stroke); background: none; color: var(--dim); border-radius: 999px; padding: 3px 10px; font: 560 12px var(--font); cursor: pointer; }
  .pill.on { color: var(--txt); border-color: var(--neon); box-shadow: inset 0 0 0 1px var(--neon); }
  .to { margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
  .to b { color: var(--neon-ink); font-weight: 600; }
  kbd { font: 11px var(--mono); color: var(--faint); }
  .ok { color: var(--ok); }
</style>
</head>
<body>
<div class="cap">
  <textarea id="t" placeholder="Anote qualquer coisa…  (#projeto no começo manda direto)" autofocus></textarea>
  <div class="bar">
    <button class="pill on" data-type="note">Nota</button>
    <button class="pill" data-type="idea">Ideia</button>
    <button class="pill" data-type="prompt">Prompt</button>
    <span class="to" id="to"></span>
    <kbd>⌘↩</kbd>
  </div>
</div>
<script src="capture.js"></script>
</body>
</html>
